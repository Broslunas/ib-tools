name: Release

# Al subir una etiqueta (git tag v1.2.0 && git push --tags) crea la release en GitHub
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas
        run: bash tests/run-tests.sh
      - name: Comprobar que la etiqueta coincide con VERSION
        run: |
          [ "v$(cat VERSION)" = "${GITHUB_REF_NAME}" ] || { echo "La etiqueta ${GITHUB_REF_NAME} no coincide con VERSION ($(cat VERSION))"; exit 1; }
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes
