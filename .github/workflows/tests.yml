name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas de ib-tools
        run: bash tests/run-tests.sh
      - name: ShellCheck
        run: |
          sudo apt-get install -y shellcheck
          shellcheck -S warning bin/* install.sh tests/run-tests.sh || true
