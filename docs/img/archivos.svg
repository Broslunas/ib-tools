<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="900" height="450" font-family="'DejaVu Sans', Arial, sans-serif">
  <title>Archivos que crea genmake y cómo se relacionan</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="900" height="450" rx="14" fill="#ffffff" stroke="#d6dbe4"/>

  <!-- Makefile -->
  <rect x="40" y="180" width="190" height="90" rx="10" fill="#fff4e0" stroke="#d98e04" stroke-width="2"/>
  <text x="135" y="216" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">Makefile</text>
  <text x="135" y="240" text-anchor="middle" font-size="13" fill="#475569">compila todos los .cc</text>
  <text x="135" y="258" text-anchor="middle" font-size="13" fill="#475569">y los enlaza</text>

  <!-- main -->
  <rect x="330" y="30" width="250" height="90" rx="10" fill="#e6f0ff" stroke="#2f6fdb" stroke-width="2"/>
  <text x="455" y="66" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">cuadrado_main.cc</text>
  <text x="455" y="90" text-anchor="middle" font-size="13" fill="#475569">programa principal:</text>
  <text x="455" y="108" text-anchor="middle" font-size="13" fill="#475569">aquí está el main()</text>

  <!-- .h -->
  <rect x="330" y="180" width="250" height="90" rx="10" fill="#f1e8ff" stroke="#7c4dcc" stroke-width="2"/>
  <text x="455" y="216" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">cuadrado.h</text>
  <text x="455" y="240" text-anchor="middle" font-size="13" fill="#475569">prototipos de las funciones</text>
  <text x="455" y="258" text-anchor="middle" font-size="13" fill="#475569">(un único .h para todo)</text>

  <!-- .cc -->
  <rect x="330" y="330" width="250" height="90" rx="10" fill="#e3f6ea" stroke="#2a9d5b" stroke-width="2"/>
  <text x="455" y="366" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">cuadrado.cc</text>
  <text x="455" y="390" text-anchor="middle" font-size="13" fill="#475569">funciones por defecto</text>
  <text x="455" y="408" text-anchor="middle" font-size="13" fill="#475569">+ las funciones que escribas tú</text>

  <!-- ejecutable -->
  <rect x="690" y="180" width="170" height="90" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="775" y="216" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">cuadrado</text>
  <text x="775" y="240" text-anchor="middle" font-size="13" fill="#cbd5e1">el programa final</text>
  <text x="775" y="258" text-anchor="middle" font-size="13" fill="#cbd5e1">lo lanza <tspan font-weight="bold">run</tspan></text>

  <!-- #include -->
  <line x1="455" y1="120" x2="455" y2="178" stroke="#475569" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="467" y="154" font-size="13" fill="#475569">#include</text>
  <line x1="455" y1="330" x2="455" y2="272" stroke="#475569" stroke-width="2" marker-end="url(#flecha)"/>
  <text x="467" y="306" font-size="13" fill="#475569">#include</text>

  <!-- make -->
  <line x1="230" y1="205" x2="328" y2="95" stroke="#475569" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="230" y1="250" x2="328" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- enlazado -->
  <line x1="582" y1="85" x2="688" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="582" y1="375" x2="688" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#flecha)"/>
</svg>
