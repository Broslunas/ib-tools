<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="'DejaVu Sans', Arial, sans-serif">
  <title>Flujo de trabajo con ib-tools</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="14" fill="#ffffff" stroke="#d6dbe4"/>

  <!-- 1 genmake -->
  <rect x="30" y="90" width="150" height="90" rx="10" fill="#fff4e0" stroke="#d98e04" stroke-width="2"/>
  <text x="105" y="126" text-anchor="middle" font-size="12" fill="#475569">1</text>
  <text x="105" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">genmake</text>
  <text x="105" y="168" text-anchor="middle" font-size="13" fill="#475569">crea los archivos</text>

  <!-- 2 editar -->
  <rect x="215" y="90" width="150" height="90" rx="10" fill="#e6f0ff" stroke="#2f6fdb" stroke-width="2"/>
  <text x="290" y="126" text-anchor="middle" font-size="12" fill="#475569">2</text>
  <text x="290" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">vim</text>
  <text x="290" y="168" text-anchor="middle" font-size="13" fill="#475569">escribes el código</text>

  <!-- 3 run -->
  <rect x="400" y="90" width="150" height="90" rx="10" fill="#e3f6ea" stroke="#2a9d5b" stroke-width="2"/>
  <text x="475" y="126" text-anchor="middle" font-size="12" fill="#475569">3</text>
  <text x="475" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">run</text>
  <text x="475" y="168" text-anchor="middle" font-size="13" fill="#475569">compila y ejecuta</text>

  <!-- 4 estilo -->
  <rect x="585" y="90" width="150" height="90" rx="10" fill="#f1e8ff" stroke="#7c4dcc" stroke-width="2"/>
  <text x="660" y="126" text-anchor="middle" font-size="12" fill="#475569">4</text>
  <text x="660" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">estilo</text>
  <text x="660" y="168" text-anchor="middle" font-size="13" fill="#475569">revisa el estilo</text>

  <!-- 5 entregar -->
  <rect x="770" y="90" width="160" height="90" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="850" y="126" text-anchor="middle" font-size="12" fill="#cbd5e1">5</text>
  <text x="850" y="148" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">entregar</text>
  <text x="850" y="168" text-anchor="middle" font-size="13" fill="#cbd5e1">código listo</text>

  <!-- flechas -->
  <line x1="182" y1="135" x2="213" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="367" y1="135" x2="398" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="552" y1="135" x2="583" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#flecha)"/>
  <line x1="737" y1="135" x2="768" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#flecha)"/>

  <!-- bucle: si falla, vuelve a editar -->
  <path d="M 475 182 C 475 250, 290 250, 290 184" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#flecha)"/>
  <text x="382" y="262" text-anchor="middle" font-size="13" fill="#475569">si falla o no te gusta, vuelve a editar</text>
</svg>
